<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 314" font-family="Helvetica, Arial, sans-serif"><rect width="720" height="314" fill="#fcfcfb"/><text x="24" y="28" font-size="17" font-weight="700" fill="#0b0b0b">How much code changes when you revise one decision?</text><text x="24" y="46" font-size="12.5" fill="#52514e">Normalized edit distance after revising a single assumption (lower = smaller, safer change)</text><text x="24" y="75" font-size="12.5" fill="#52514e">Manually rewriting the prompt</text><path d="M24,82 h531.1446153846153 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-531.1446153846153 z" fill="#9a9993"/><text x="567.1446153846153" y="96.5" font-size="13" font-weight="600" fill="#0b0b0b">0.57</text><text x="24" y="129" font-size="12.5" fill="#52514e">Regenerating the whole program</text><path d="M24,136 h507.8369230769231 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-507.8369230769231 z" fill="#9a9993"/><text x="543.8369230769231" y="150.5" font-size="13" font-weight="600" fill="#0b0b0b">0.55</text><text x="24" y="183" font-size="12.5" fill="#52514e">Asking the LLM to edit in place</text><path d="M24,190 h281.2861538461538 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-281.2861538461538 z" fill="#9a9993"/><text x="317.2861538461538" y="204.5" font-size="13" font-weight="600" fill="#0b0b0b">0.31</text><text x="24" y="237" font-size="12.5" fill="#52514e">AssumptionMiner (targeted regeneration)</text><path d="M24,244 h223.4830769230769 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-223.4830769230769 z" fill="#2a78d6"/><text x="259.4830769230769" y="258.5" font-size="13" font-weight="600" fill="#0b0b0b">0.24</text><text x="24" y="292" font-size="11.5" fill="#52514e" font-style="italic">Targeted regeneration touches less than half the code that full regeneration does.</text></svg>