<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Helvetica, Arial, sans-serif"><rect width="720" height="260" fill="#fcfcfb"/><text x="24" y="28" font-size="17" font-weight="700" fill="#0b0b0b">Can the AI&#8217;s hidden assumptions be recovered automatically?</text><text x="24" y="46" font-size="12.5" fill="#52514e">F1 score for assumption extraction on the 180-task benchmark (higher is better)</text><text x="24" y="75" font-size="12.5" fill="#52514e">AssumptionMiner (ensemble of two open-source models)</text><path d="M24,82 h490.496 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-490.496 z" fill="#2a78d6"/><text x="526.496" y="96.5" font-size="13" font-weight="600" fill="#0b0b0b">0.82</text><text x="24" y="129" font-size="12.5" fill="#52514e">Reading code comments &#8212; strongest offline baseline</text><path d="M24,136 h132.35 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-132.35 z" fill="#9a9993"/><text x="168.35" y="150.5" font-size="13" font-weight="600" fill="#0b0b0b">0.23</text><text x="24" y="183" font-size="12.5" fill="#52514e">Rule-based pattern matching</text><path d="M24,190 h45.086 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-45.086 z" fill="#9a9993"/><text x="81.086" y="204.5" font-size="13" font-weight="600" fill="#0b0b0b">0.08</text><text x="24" y="238" font-size="11.5" fill="#52514e" font-style="italic">AssumptionMiner recovers 3.6&#215; more of the assumptions than the best baseline.</text></svg>